name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build-time only. Nothing connects to a database during `next build`; these
# exist so the config module can validate its environment.
env:
  DATABASE_URL: postgres://build:build@localhost:5432/build
  BETTER_AUTH_SECRET: ci-placeholder-secret-value-not-used-at-runtime
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  verify:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sse_shop
          POSTGRES_PASSWORD: sse_shop
          POSTGRES_DB: sse_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sse_shop -d sse_shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sse_shop:sse_shop@localhost:5432/sse_shop
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_STORE_URL: http://localhost:3100
      ADMIN_EMAIL: owner@example.com
      ADMIN_PASSWORD: change-this-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Global setup migrates and seeds this database before the first spec.
      - run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
