# Local development database only. Not used in production.
#   pnpm db:up   /   pnpm db:down
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: sse_shop
      POSTGRES_PASSWORD: sse_shop
      POSTGRES_DB: sse_shop
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sse_shop -d sse_shop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
